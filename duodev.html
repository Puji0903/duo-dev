<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DUO-DEV - About Us</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        :root {
            --yellow: #FFD400;
            --black: #0b0a0a;
            --blue: #1E4FD6;
            --pink: #FF9FCE;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--black);
            font-family: 'Nunito', sans-serif;
            color: var(--white);
        }

        /* ================= NAVBAR ================= */

        .navbar {
            background: var(--yellow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 48px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid var(--black);
            background: repeating-conic-gradient(
                var(--black) 0% 25%,
                transparent 0% 50%
            );
            background-size: 60% 60%;
            background-position: center;
            background-repeat: no-repeat;
        }

        .logo-text {
            font-family: 'Archivo Black', sans-serif;
            font-size: 1.2rem;
            color: var(--black);
            font-style: italic;
            text-decoration: underline;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: var(--black);
            text-decoration: underline;
            font-weight: 800;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        /* ================= NAV TOGGLE ================= */

        /* ================= SEARCH ================= */

        .search-box {
            display: flex;
            align-items: center;
            background: var(--blue);
            border-radius: 999px;
            padding: 6px 6px 6px 20px;
            width: 200px;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            flex: 1;
            font-size: 0.9rem;
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .search-btn {
            background: #fff;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            flex-shrink: 0;
        }

        /* ================= HERO / ABOUT US ================= */

        .about-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 32px;
            padding: 64px 48px 40px;
            position: relative;
        }

        .title-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            text-decoration: none;
        }

        .title-pill {
            background: var(--pink);
            color: var(--white);
            font-family: 'Archivo Black', sans-serif;
            font-size: clamp(2.5rem, 6vw, 4.2rem);
            padding: 28px 60px 28px 40px;
            border-radius: 999px;
            letter-spacing: 1px;
            -webkit-text-stroke: 2px var(--black);
        }

        .smiley {
            width: 90px;
            height: 90px;
            margin-left: -30px;
            border-radius: 50%;
            background: var(--yellow);
            border: 3px solid var(--black);
            position: relative;
            flex-shrink: 0;
        }

        .smiley::before {
            content: "";
            position: absolute;
            top: 30px;
            left: 22px;
            width: 10px;
            height: 16px;
            background: var(--black);
            border-radius: 50%;
            box-shadow: 30px 0 0 var(--black);
        }

        .smiley::after {
            content: "";
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 50px;
            height: 24px;
            border-bottom: 6px solid var(--black);
            border-radius: 0 0 50px 50px;
        }

        .about-copy {
            display: flex;
            align-items: center;
            gap: 20px;
            max-width: 380px;
        }

        .sparkle {
            width: 60px;
            height: 60px;
            background: var(--pink);
            flex-shrink: 0;
            clip-path: polygon(
                50% 0%,
                65% 35%,
                100% 50%,
                65% 65%,
                50% 100%,
                35% 65%,
                0% 50%,
                35% 35%
            );
        }

        .about-copy p {
            font-size: 1.05rem;
            line-height: 1.6;
            margin: 0;
            color: #EDEDED;
        }

        /* ================= CARDS ================= */

        .cards {
            display: flex;
            gap: 26px;
            padding: 20px 48px 80px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .profile-card {
            width: 300px;
            border: 4px solid var(--blue);
            border-radius: 10px;
            overflow: hidden;
            background: #ccc;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .profile-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 28px rgba(0, 0, 0, 0.35);
        }

        /* ================= CARD TAB ================= */

        .card-tab {
            background: var(--yellow);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-bottom: 4px solid var(--blue);
        }

        .card-tab .x-icon {
            width: 22px;
            height: 22px;
            background: var(--blue);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--yellow);
            font-weight: 800;
            font-size: 0.9rem;
        }

        /* ================= CARD PHOTO ================= */

        .card-photo {
            width: 100%;
            aspect-ratio: 4 / 5;
            background: linear-gradient(160deg, #9aa0a6, #6b7176);
            position: relative;
            overflow: hidden;
        }

        .photo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            inset: 0;
        }

        .card-photo .flower {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 46px;
            height: 46px;
            background: var(--blue);
            border-radius: 50%;
            clip-path: polygon(
                50% 0%,
                63% 25%,
                90% 15%,
                80% 40%,
                100% 50%,
                80% 60%,
                90% 85%,
                63% 75%,
                50% 100%,
                37% 75%,
                10% 85%,
                20% 60%,
                0% 50%,
                20% 40%,
                10% 15%,
                37% 25%
            );
        }

        .card-photo .flower::after {
            content: "";
            position: absolute;
            inset: 15px;
            background: var(--yellow);
            border-radius: 50%;
        }

        /* ================= CARD FOOTER ================= */

        .pcard-footer {
            background: var(--blue);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
        }

        .pcard-footer .name {
            font-weight: 800;
            font-size: 1rem;
            margin: 0 0 2px;
            color: #fff;
        }

        .pcard-footer .role {
            font-size: 0.85rem;
            margin: 0;
            color: rgba(255, 255, 255, 0.85);
        }

        .pcard-footer .x-icon-big {
            width: 30px;
            height: 30px;
            background: var(--yellow);
            border-radius: 6px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: var(--blue);
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 900px) {

            .navbar {
                flex-wrap: wrap;
                gap: 16px;
                padding: 20px 24px;
            }

            .about-heading {
                padding: 48px 24px 32px;
            }

            .cards {
                padding: 20px 24px 60px;
            }
        }

        @media (max-width: 640px) {

            .nav-links {
                flex-direction: column;
                gap: 14px;
            }

            .search-box {
                width: 100%;
            }

            .title-pill {
                padding: 22px 40px 22px 28px;
            }

            .smiley {
                width: 60px;
                height: 60px;
                margin-left: -20px;
            }

            .about-heading {
                flex-direction: column;
                align-items: flex-start;
            }
        }


        /* ================= OVERRIDE BOOTSTRAP NAVBAR ================= */

        .navbar-toggler {
            border: 3px solid var(--black);
            padding: 4px 8px;
        }

        .navbar-toggler:focus {
            box-shadow: 0 0 0 3px rgba(11, 10, 10, 0.35);
        }

        .navbar-collapse {
            align-items: center;
        }

        @media (min-width: 768px) {
            .navbar-collapse {
                justify-content: flex-end;
                gap: 40px;
            }
        }

        @media (max-width: 767.98px) {
            .navbar-collapse {
                padding-top: 12px;
            }

            .nav-links {
                flex-direction: column;
                gap: 12px;
            }

            .navbar-collapse .search-box,
            .navbar-collapse .back-btn {
                margin-top: 16px;
            }

            .navbar-collapse .back-btn {
                display: inline-block;
            }
        }
    </style>
</head>

<body>

    <!-- ================= JAVASCRIPT ================= -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
